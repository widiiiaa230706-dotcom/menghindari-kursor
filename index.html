
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Menghindari Kursor</title>

    <!-- CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #fff;
            margin: 0;
            padding: 40px 20px;
        }

        h2 {
            color: #333;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 14px;
        }

        .area {
            position: relative;
            width: 100%;
            height: 400px;
            margin-top: 20px;
            overflow: hidden;
        }

        button {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: left 0.2s, top 0.2s;
        }

        button:hover {
            background-color: #ff1493;
        }

        #pesan {
            color: #ff1493;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <!-- HTML -->
    <h2>Bisakah Kamu Klik Tombol Ini?</h2>
    <p>Arahkan mouse ke tombol untuk mencoba!</p>

    <div class="area" id="area">
        <button id="tombol">Klik Saya!</button>
    </div>

    <p id="pesan"></p>

    <!-- JavaScript -->
    <script>
        const tombol = document.getElementById("tombol");
        const area = document.getElementById("area");
        const pesan = document.getElementById("pesan");

        tombol.addEventListener("mouseenter", function(event) {

            // Menghitung batas posisi tombol
            const maxX = area.clientWidth - tombol.offsetWidth;
            const maxY = area.clientHeight - tombol.offsetHeight;

            // Menentukan posisi secara acak
            const x = Math.random() * maxX;
            const y = Math.random() * maxY;

            // Memindahkan tombol
            tombol.style.left = x + "px";
            tombol.style.top = y + "px";
            tombol.style.transform = "none";

            

            // Menampilkan informasi event
            console.log(event);
        });
    </script>

</body>
</html>
